name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "${GITHUB_REF_NAME}" != "v${app_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version v${app_version}."
            exit 1
          fi

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Require signing secrets for releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_STORE_PASSWORD \
            ANDROID_KEY_PASSWORD \
            ANDROID_KEY_ALIAS
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required Android signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Restore Android signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage APK
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/debug-tools-v${app_version}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-tools-android
          path: build/debug-tools-v*-android.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $versionLine = Select-String -Path 'pubspec.yaml' -Pattern '^version:'
          $appVersion = ($versionLine.Line -replace '^version:\s*', '') -replace '\+.*$', ''
          Compress-Archive `
            -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath "build\debug-tools-v$appVersion-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-tools-windows-x64
          path: build/debug-tools-v*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: debug-tools-android
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: debug-tools-windows-x64
          path: release

      - name: Generate checksums
        shell: bash
        run: cd release && sha256sum * > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
